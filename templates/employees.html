{% extends "base.html" %}{% block content %}
<h1>Employees</h1>
<form method="post" action="{{ url_for('add_employee') }}" class="card row">
<label>ID<br><input name="emp_id" required pattern="[A-Za-z0-9_\-]{1,32}" placeholder="E001"></label>
<label>Name<br><input name="name" required placeholder="Full name"></label>
<label>Department<br><input name="department" placeholder="Optional"></label>
<button>Add &amp; enroll face</button></form>
<h2>Registered</h2>
<table><tr><th>ID</th><th>Name</th><th>Department</th><th>Face samples</th><th></th></tr>
{% for e in employees %}<tr><td>{{ e.emp_id }}</td><td>{{ e.name }}</td><td>{{ e.department }}</td>
<td>{{ e.samples }} / {{ samples_required }}</td><td>
<a class="btn ghost" href="{{ url_for('enroll', emp_id=e.emp_id) }}">Enroll / add photos</a>
<form class="inline" method="post" action="{{ url_for('delete_employee', emp_id=e.emp_id) }}"
 onsubmit="return confirm('Delete this employee, their photos and attendance?')"><button class="danger">Delete</button></form>
</td></tr>{% else %}<tr><td colspan="5" class="mute">No employees yet - add one above.</td></tr>{% endfor %}</table>
{% endblock %}
