<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Face Attendance{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><b>&#128247; Face Attendance</b>
<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('kiosk') }}">Live Kiosk</a>
<a href="{{ url_for('employees') }}">Employees</a><a href="{{ url_for('report') }}">Reports</a>
<span class="tag">engine: {{ backend }}</span></nav>
<main>{% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}
<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
